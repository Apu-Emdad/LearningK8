apiVersion: v1
kind: Service
metadata:
  name: backend-service          # Other pods reach it by this DNS name
spec:
  type: ClusterIP                # Internal only, not reachable from outside the cluster
  selector:
    app: backend                 # Routes to ANY pod with this label
  ports:
  - port: 8080                   # The port THIS SERVICE listens on (what callers use)
    targetPort: 8080             # The port the CONTAINER listens on (must match the app's real port)
